<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0%" stop-color="#071022"/>
      <stop offset="50%" stop-color="#0b3a48"/>
      <stop offset="100%" stop-color="#051627"/>
    </linearGradient>
    <filter id="grain"><feTurbulence baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0" result="mono"/><feBlend in="SourceGraphic" in2="mono" mode="overlay"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#lg)"></rect>
  <g opacity="0.25">
    <rect width="100%" height="100%" filter="url(#grain)"></rect>
  </g>
  <g>
    <circle cx="300" cy="400" r="220" fill="#0ea5a4" opacity="0.06">
      <animate attributeName="cx" values="300;1620;300" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1600" cy="700" r="320" fill="#06b6d4" opacity="0.04">
      <animate attributeName="cx" values="1600;300;1600" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
